[package]
name = "isla-desk"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "isla_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2.0.21"
tracing = "0.1.44"
specta-typescript = "0.0.9"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
base64 = "0.23.1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
tauri-plugin-autostart = "2.7.0"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
tracing-subscriber = "0.3.23"
regex = "1.13.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
tungstenite = "0.30.0"
tauri-plugin-global-shortcut = "2"
arboard = { version = "3", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt"] }

# macOS: ubah jendela pulau jadi NSPanel agar tampil di atas aplikasi layar penuh.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFMachPort"] }
core-graphics = "0.24"
core-foundation = "0.10"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_WinRT", "Win32_System_Console", "Win32_System_Power", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Wmi", "Win32_System_Variant", "Win32_System_Rpc", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
